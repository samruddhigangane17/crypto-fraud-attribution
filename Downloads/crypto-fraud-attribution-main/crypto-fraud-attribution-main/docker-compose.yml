services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-attribution-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - BLOCKSTREAM_API_URL=${BLOCKSTREAM_API_URL:-https://blockstream.info/api}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-attribution-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
